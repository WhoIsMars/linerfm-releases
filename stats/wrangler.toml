name = "linerfm-site-stats"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Database creato con: npx wrangler d1 create linerfm-site-stats
# Tabella:             npx wrangler d1 execute linerfm-site-stats --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "linerfm-site-stats"
database_id = "b2e57a63-66d7-4a32-b8e3-dcb701b3bc48"

# Registro delle prove gratuite del worker licenze: la dashboard lo LEGGE soltanto (scheda Utenti).
[[kv_namespaces]]
binding = "TRIAL_LEDGER"
id = "d2bf690b427c4c778eeba30c34691ee2"

# Riepilogo numeri su Discord #metrics ogni 6 ore (00/06/12/18 UTC = 02/08/14/20 Roma d'estate): src/notify.ts
[triggers]
crons = ["0 */6 * * *"]
